# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name franchisedataexpert.com api.franchisedataexpert.com n8n.franchisedataexpert.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS - Dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name franchisedataexpert.com;
    
    # SSL Certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/franchisedataexpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franchisedataexpert.com/privkey.pem;
    
    # Strong SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Serve React dashboard
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # React app headers
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    
    # Static assets (CSS, JS, etc)
    location ~* \.(?:css|js|woff|woff2|ttf|otf|eot|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}

# HTTPS - API Service
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.franchisedataexpert.com;
    
    # SSL Certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/franchisedataexpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franchisedataexpert.com/privkey.pem;
    
    # Strong SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Proxy to PDF service
    location / {
        proxy_pass http://pdf-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts for long-running requests (PDF generation)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Websocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
# HTTPS - N8N Webhooks
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.franchisedataexpert.com;
    
    # SSL Certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/franchisedataexpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franchisedataexpert.com/privkey.pem;
    
    # Strong SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Proxy to N8N service (container name on docker network)
    location / {
        proxy_pass http://root-n8n-1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # N8N specific timeouts (webhooks can take time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Websocket support (N8N uses WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_buffering off;
    }
}